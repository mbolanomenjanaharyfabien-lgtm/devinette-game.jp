<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jeux devinette</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <header id="header">
        <nav>
            <div class="logo">
                <h1>Jeux. <span class="logo">jp</span></h1>
            </div>
            <div class="mode">
                <i onclick="sombre()">Sombre</i>
                <i onclick="clair()">Clair</i>
            </div>
        </nav>
    </header>

    <main id="main">
        <section class="tab_bord">
            <section class="chrono">
               <p> 00 : 00 : <span class="time"> 00 </span> </p>
            </section>
            <section class="score">
                <p>Score : <span id="score">0</span></p>
            </section>
        </section>

        <section class="titre">
            <h1 id="titre">Deviner un nombre entre 1 à 10</h1>
        </section>
        <section class="input">
            <input id="input" type="text" placeholder="_" required>
        </section>
        <section class="bouton">
            <button class="btn" onclick="confirmer()">Confirmer</button>
            <button class="btn_annuler" onclick="annuler()">Annuler</button>
            <button class="btn" onclick="continuer()">Continuer</button>
        </section>
        <section class="message">
            <p>Vous avez <span class="tentative" id="tentative"> 3 </span> tentative</p>
            <p class="alert"></p>
        </section>
    </main>


</body>
</html>
